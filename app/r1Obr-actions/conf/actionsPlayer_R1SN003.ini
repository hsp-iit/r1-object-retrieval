# yarpActionsPlayer configuration for R1SN003 (R1 mk3).
#
# Launched by scripts/R1_actionsPlayer.xml with this folder as working
# directory: yarpActionsPlayer opens the action files below relative to it.
#
# Joints are selected by name, so the same remappers work with the arms
# exposed with or without the hand joints. The hand joints are never commanded.
#
# The action files are generated from conf/keyframes: see README.md.

[CLIENTS]
right_arm       /cer/right_arm
left_arm        /cer/left_arm
head            /cer/head
torso           /cer/torso

[REMAPPERS]
right_arm_head  (right_arm head)                 (r_shoulder_pitch r_shoulder_roll r_shoulder_yaw r_elbow r_wrist_yaw r_wrist_roll r_wrist_pitch neck_pitch_joint neck_yaw_joint)
arms_head       (right_arm left_arm head)        (r_shoulder_pitch r_shoulder_roll r_shoulder_yaw r_elbow r_wrist_yaw r_wrist_roll r_wrist_pitch l_shoulder_pitch l_shoulder_roll l_shoulder_yaw l_elbow l_wrist_yaw l_wrist_roll l_wrist_pitch neck_pitch_joint neck_yaw_joint)
upper_body      (right_arm left_arm head torso)  (r_shoulder_pitch r_shoulder_roll r_shoulder_yaw r_elbow r_wrist_yaw r_wrist_roll r_wrist_pitch l_shoulder_pitch l_shoulder_roll l_shoulder_yaw l_elbow l_wrist_yaw l_wrist_roll l_wrist_pitch neck_pitch_joint neck_yaw_joint torso_heave_eq_joint torso_pitch_eq_joint torso_roll_eq_joint torso_yaw_joint)

[ACTIONS]
hi               right_arm_head  actions/hi.txt
dab              arms_head       actions/dab.txt
sadness          arms_head       actions/sadness.txt
navigation_pose  upper_body      actions/navigation_pose.txt
